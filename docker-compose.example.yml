services:
  # 1. llama.cpp server running JevK5 GGUF model
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: jevk5-llama-backend
    restart: unless-stopped
    command: >
      --hf-repo alibiserikbay/JevK5-GGUF
      --hf-file jevk5-4b-v0.3-Q8_0.gguf
      -c 8192
      -ngl ${NGL:-99}
      --host 0.0.0.0
      --port 8080
    ports:
      - "8080:8080"
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 2. TypeSafe API Server wrapping JevK5
  jevk5-typesafe-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jevk5-typesafe-server
    restart: unless-stopped
    depends_on:
      llama-server:
        condition: service_healthy
    environment:
      - LLAMA_SERVER_URL=${LLAMA_SERVER_URL:-http://llama-server:8080}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - MODEL_NAME=${MODEL_NAME:-jevk5-4b-v0.3-Q8_0}
      - TEMPERATURE=${TEMPERATURE:-1.22}
      - KNOCKOUT_TEMPERATURE=${KNOCKOUT_TEMPERATURE:-0.93}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hf-cache:
    name: jevk5-huggingface-cache
