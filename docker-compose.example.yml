services:
  # 1. llama.cpp server running JevK5 GGUF model
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: jevk5-llama-backend
    restart: unless-stopped
    command: >
      --hf-repo ${HF_REPO:-alibiserikbay/JevK5-GGUF}
      --hf-file ${HF_FILE:-jevk5-4b-v0.3-Q8_0.gguf}
      -c ${CTX_SIZE:-8192}
      -ngl ${NGL:-99}
      --host 0.0.0.0
      --port 8080
    ports:
      - "8080:8080"
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # 2. TypeSafe API Server wrapping JevK5
  jevk5-typesafe-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jevk5-typesafe-server
    restart: unless-stopped
    depends_on:
      llama-server:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override LLAMA_SERVER_URL to use the internal Docker container name instead of localhost
      - LLAMA_SERVER_URL=http://llama-server:8080
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hf-cache:
    name: jevk5-huggingface-cache
