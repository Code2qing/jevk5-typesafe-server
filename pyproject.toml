[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jevk5-typesafe-server"
version = "0.1.0"
description = "TypeSafe-compatible System One API server backed by JevK5 on llama-server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jevk5>=0.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "anyio>=3.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "anyio>=3.7.0",
]

[project.scripts]
jevk5-typesafe-serve = "run:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
jevk5 = { git = "https://github.com/allebee/jevk5", tag = "v0.3.0" }

[tool.uv]
exclude-dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "safetensors",
    "triton",
    "huggingface-hub",
    "numpy",
    "jinja2",
]
